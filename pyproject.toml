[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-swe-agent"
version = "0.1.0"
description = "Multi-agent SWE framework for Qiskit — autonomous issue-to-patch pipeline"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "tenacity>=8.0.0",
    "PyGithub>=2.0.0",
    "rich>=13.0.0",
]

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
qiskit-swe = "orchestrator.cli:main"
